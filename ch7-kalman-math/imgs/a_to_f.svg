<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1696 262" width="1696" height="262" font-family="Atkinson Hyperlegible, Noto Sans KR, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="20" y="20" width="520" height="190" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="280" y="92" font-size="32" text-anchor="middle" fill="#0f172a" font-weight="700">A: continuous</text>
<text x="280" y="150" font-size="30" text-anchor="middle" fill="#0f172a" font-weight="400">dx/dt = A x</text>
<line x1="560" y1="70" x2="1130" y2="70" stroke="#d97706" stroke-width="4" marker-end="url(#s)"/>
<text x="845" y="50" font-size="26" text-anchor="middle" fill="#d97706" font-weight="700">discretize over &#916;t</text>
<rect x="1150" y="20" width="526" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="1413" y="92" font-size="32" text-anchor="middle" fill="#0f172a" font-weight="700">F: discrete</text>
<text x="1413" y="150" font-size="30" text-anchor="middle" fill="#0f172a" font-weight="400">x<tspan baseline-shift="sub" font-size="75%">k</tspan> = F x<tspan baseline-shift="sub" font-size="75%">k-1</tspan></text>
<rect x="640" y="100" width="410" height="44" rx="22" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="845" y="131" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="400">matrix exponential</text>
<rect x="640" y="154" width="410" height="44" rx="22" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="845" y="185" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="400">LTI theory (Laplace)</text>
<rect x="640" y="208" width="410" height="44" rx="22" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="845" y="239" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="400">numerical methods</text></svg>